<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>classList.contains()</title>
    <link rel="stylesheet" href="style.css">
    <script src="script_04.js" defer></script>
  </head>
  <body>
    <h1>classList.contains()</h1>
    <p data-text>テキスト</p>

    <p>
      スタイル：
      <button type="button" onclick="toggleColor()">文字色を切り替え</button>
      <button type="button" onclick="toggleSize()">文字サイズを切り替え</button>
    </p>

    <p>
      確認：
      <button type="button" onclick="checkColor()">redクラスの確認</button>

    </p>

    <p data-result>結果が表示されます</p>
