<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>イベントオブジェクト</title>
    <script src="script.js" defer></script>

    <style>
      .link {
        display: block flow-root;
        border: 1px solid;
        padding: 1rem;
        text-align: center;
        text-decoration: none;
      }

      .span {
        border: 1px dotted;
        padding: .5rem;
        color: #000;
      }
    </style>
  </head>
  <body>
    <h1>イベントオブジェクト</h1>
    <p>
      <a href="https://shibajuku.net" target="_blank" class="link" data-link>
        <span class="span">Shibajuku</span>
      </a>
    </p>

    <dl>
      <dt>target</dt>
      <dd data-display="target">ここに target が表示</dd>
      <dt>currentTarget</dt>
      <dd data-display="current-target">ここに currentTarget が表示</dd>
    </dl>


  </body>
</html>
