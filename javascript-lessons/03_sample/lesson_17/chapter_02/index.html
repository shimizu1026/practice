<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>スムーススクロール</title>
    <script src="script.js" defer></script>

    <style>
      .header {
        position: fixed;
        inset: 1.5rem 2.5vi auto;
        display: block flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgb(255 255 255 / 0.5);
        backdrop-filter: blur(4px);
        border-radius: 2rem;
        border: 1px solid #fff;
        box-shadow: 0 0 16px rgb(0 0 0 / 0.16);

        h1 {
          font-size: 1.25rem;
          margin-inline-start: 1rem;

        }
      }

      .nav-global__list {
        display: block flex;
        justify-content: center;
        inline-size: fit-content;

        padding: 0;
        margin-block: 0;
        margin-inline: auto;
        list-style-type: "";

        a {
          display: block flow;
          padding: 1rem;
          text-decoration: none;
          color: inherit;
          font-weight: 700;

          &:hover,
          &:focus-visible {
            color: #0d6bb9;
          }
        }

      }

      .scroll-count {
        position: fixed;
        inset-inline-end: 0;
        inset-block-end: 0;
        background-color: #fff;
        box-shadow: 0 0 16px rgb(0 0 0 / 0.16);
        padding: 1.5rem;
        margin: 0;
        border-radius: 1rem 0 0 0;
      }

      .section {
        display: block grid;
        place-content: center;
        min-block-size: 100vh;
        margin-block-start: .5rem;
        border-radius: 1rem;

        &:nth-child(odd) {
          background-color: #f0f0f0;
        }

        &:nth-child(even) {
          background-color: #3b454b;
          color: #fff;
        }

        h2 {
          font-size: 2rem;
          font-weight: 900;
        }

      }
    </style>
  </head>
  <body id="top">
    <header class="header">
      <h1>スムーススクロール</h1>
      <nav class="nav-global">
        <ul class="nav-global__list">
          <li><a href="#section1">セクション1</a></li>
          <li><a href="#section2">セクション2</a></li>
          <li><a href="#section3">セクション3</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <p class="scroll-count">スクロール量: <span data-scroll>0px</span></p>
      <section id="section1" class="section">
        <h2>セクション1</h2>
      </section>
      <section id="section2" class="section">
        <h2>セクション2</h2>
      </section>
      <section id="section3" class="section">
        <h2>セクション3</h2>
      </section>
    </main>

    <footer>
      <p><a href="#top">ページの先頭へ</a></p>
    </footer>
  </body>
</html>
